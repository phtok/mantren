name: FR-Übersetzung zurückschreiben

# Faltet Louis' in Supabase gespeicherte Fassungen automatisch zurück in den
# statischen Korpus (src/data/uebersetzung-fr.json) und committet sie auf main.
#
# Lesende sehen Louis' Änderungen ohnehin sofort (Live-Overlay aus Supabase);
# dieser Lauf hält die statische, offline-fähige Grundlage nach und macht sie
# archivisch dauerhaft. Läuft stündlich und lässt sich jederzeit von Hand
# starten (Run workflow).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-fr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fassungen aus Supabase übernehmen
        run: node scripts/sync-fr.mjs

      - name: Committen und deployen, falls geändert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain src/data/uebersetzung-fr.json)" ]; then
            echo "Keine Änderungen — nichts zu übernehmen."
            exit 0
          fi
          git config user.name "mantren-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/uebersetzung-fr.json
          git commit -m "FR-Übersetzung: Louis' Stand aus Supabase übernommen"
          git push
          # Vercel (mantra.saetzerei.com) deployt über seine eigene GitHub-App
          # automatisch bei diesem Push. GitHub Pages zusätzlich anstoßen — ein
          # Push mit GITHUB_TOKEN triggert keine on:push-Workflows.
          gh workflow run deploy.yml --ref main || true
